<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Scraping</title>
    <link rel="stylesheet" href="/api/static/styles.css">
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
    <h1>Dashboard Scraping</h1>

    <div id="calendar"></div>

    <!-- Modal para detalles del evento -->
    <div id="details-modal" class="hidden">
        <div>
            <button id="close-modal">Cerrar</button>
            <pre id="event-details"></pre>
        </div>
    </div>

    <h2>Datos Scrapeados</h2>
    <div>
        <button id="prev-page">Anterior</button>
        <span id="page-info"></span>
        <button id="next-page">Siguiente</button>
    </div>
    <ul id="scraped-list"></ul>

    <h2>Logs del Scheduler</h2>
    <ul id="logs-list"></ul>

    <!-- Tu script de calendar -->
    <script src="/api/static/scripts/calendar.js"></script>
    <script>
        // PAGINACIÓN DE DATOS SCRAPEADOS
        let page = 1;
        const perPage = 10;
        function fetchScrapedData() {
            fetch(`/api/scraped-data-paged?page=${page}&per_page=${perPage}`)
                .then(res => res.json())
                .then(data => {
                    const ul = document.getElementById('scraped-list');
                    ul.innerHTML = "";
                    if (Array.isArray(data.items) && data.items.length > 0) {
                        data.items.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = JSON.stringify(item);
                            ul.appendChild(li);
                        });
                    } else {
                        ul.innerHTML = "<li>No hay datos scrapeados</li>";
                    }
                    document.getElementById('page-info').textContent = `Página ${data.page} de ${Math.ceil(data.total / data.per_page)}`;
                    document.getElementById('prev-page').disabled = data.page <= 1;
                    document.getElementById('next-page').disabled = data.page >= Math.ceil(data.total / data.per_page);
                });
        }
        fetchScrapedData();

        document.getElementById('prev-page').onclick = () => { if(page > 1) { page--; fetchScrapedData(); } }
        document.getElementById('next-page').onclick = () => { page++; fetchScrapedData(); }

        // Mostrar logs del scheduler
        fetch('/api/scheduler-logs')
            .then(res => res.json())
            .then(logs => {
                const ul = document.getElementById('logs-list');
                if (Array.isArray(logs) && logs.length > 0) {
                    logs.forEach(log => {
                        const li = document.createElement('li');
                        li.textContent = JSON.stringify(log);
                        ul.appendChild(li);
                    });
                } else {
                    ul.innerHTML = "<li>No hay logs</li>";
                }
            });
    </script>
</body>
</html>
